<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA 401 凭证轮换</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--line:#dbe2ee;--text:#172033;--muted:#64748b;--primary:#3b66f5;--danger:#b42318;--ok:#027a48;--warn:#b54708}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:1380px;margin:0 auto;padding:28px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    h1{font-size:25px;margin:0}.muted{color:var(--muted)}a{color:var(--primary);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.04);margin-bottom:16px}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.spacer{flex:1}button,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--text)}button{cursor:pointer;font-weight:650}button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button:disabled{opacity:.5;cursor:not-allowed}
    .counts{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:10px;margin-top:14px}.metric{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.metric b{display:block;font-size:20px}
    .notice{margin-top:12px;padding:10px 12px;border-radius:9px;background:#fff7ed;color:#9a3412}.notice.error{background:#fef2f2;color:var(--danger)}.notice.ok{background:#ecfdf3;color:var(--ok)}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1280px}th,td{border-bottom:1px solid #edf1f7;padding:11px 9px;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#f8fafc}.files{max-width:260px;word-break:break-all;color:var(--muted);font-size:12px}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#fff7ed;color:var(--warn)}.retrying{background:#eff6ff;color:#1d4ed8}.verified,.cleaned{background:#ecfdf3;color:var(--ok)}.cleanup_ready{background:#eef2ff;color:#4338ca}.failed,.ambiguous{background:#fef2f2;color:var(--danger)}
    .queue{margin:12px 0 0;white-space:pre-wrap;word-break:break-all;background:#0f172a;color:#e2e8f0;border-radius:9px;padding:12px;max-height:260px;overflow:auto}.hidden{display:none}
    @media(max-width:800px){.counts{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>CPA 401 凭证轮换</h1><div class="muted">快照旧文件 → 复用现有 Codex OAuth → CPA 后置验证 → 精确旧文件审阅。</div></div><a href="/">← 返回控制台</a></div>
  <section class="card">
    <div class="toolbar">
      <button class="primary" id="detectBtn">检测 CPA 401</button>
      <button id="retryBtn" disabled>补跑 Codex（已选 0）</button>
      <button id="cleanupBtn" disabled>生成清理审阅（已选 0）</button>
      <label>并发 <select id="workers"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select></label>
      <span class="spacer"></span><span class="muted" id="checkedAt">正在读取审计状态…</span>
    </div>
    <div class="counts">
      <div class="metric"><span class="muted">401 / unauthorized</span><b id="unauthorizedCount">0</b></div>
      <div class="metric"><span class="muted">已验证恢复</span><b id="verifiedCount">0</b></div>
      <div class="metric"><span class="muted">待清理审阅</span><b id="cleanupReadyCount">0</b></div>
      <div class="metric"><span class="muted">状态正常</span><b id="healthyCount">0</b></div>
      <div class="metric"><span class="muted">状态未知</span><b id="unknownCount">0</b></div>
    </div>
    <div class="notice">检测与后置验证只读取/刷新 CPA 状态。未配置并验证 CPA 删除适配器时，系统只生成精确旧文件名清单，绝不猜测删除接口，也不会用本地 SQLite 删除替代 CPA 清理。</div>
    <div id="message"></div>
    <pre id="cleanupQueue" class="queue hidden"></pre>
  </section>
  <section class="card table-wrap">
    <table>
      <thead><tr><th><input type="checkbox" id="selectAll" aria-label="全选可操作账号"></th><th>邮箱</th><th>状态</th><th>原因</th><th>补跑前文件</th><th>补跑后文件</th><th>唯一替代</th><th>待清理旧文件</th><th>本地 Codex</th></tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="muted">正在读取最近一次审计状态…</td></tr></tbody>
    </table>
  </section>
</div>
<script>
(() => {
  const $ = selector => document.querySelector(selector);
  const selected = new Set();
  let items = [];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const stateText = {pending:'待补跑',retrying:'补跑中',verified:'已验证',cleanup_ready:'待清理审阅',cleaned:'已清理',failed:'补跑失败',ambiguous:'状态不明确'};
  async function api(path, options={}) {
    const response = await fetch(path, {...options, headers:{'Content-Type':'application/json', ...(options.headers || {})}});
    const data = await response.json().catch(() => ({ok:false,error:`HTTP ${response.status}`}));
    if (!response.ok || data.ok === false) throw Object.assign(new Error(data.error || `HTTP ${response.status}`), {data, status:response.status});
    return data;
  }
  function message(text='', kind='') { $('#message').innerHTML = text ? `<div class="notice ${kind}">${esc(text)}</div>` : ''; }
  function fileLines(values) { return (values || []).map(esc).join('<br>') || '—'; }
  function updateCounts(data) {
    const counts = data.counts || {};
    $('#unauthorizedCount').textContent = counts.unauthorized || 0;
    $('#verifiedCount').textContent = counts.verified || 0;
    $('#cleanupReadyCount').textContent = counts.cleanup_ready || 0;
    $('#healthyCount').textContent = counts.healthy || 0;
    $('#unknownCount').textContent = counts.unknown || 0;
    $('#checkedAt').textContent = data.checked_at ? `状态时间 ${new Date(data.checked_at).toLocaleString()}` : '尚未执行远端检测';
  }
  function render() {
    const actionable = items.filter(item => item.retryable || item.state === 'cleanup_ready');
    for (const email of [...selected]) if (!actionable.some(item => item.email === email)) selected.delete(email);
    $('#rows').innerHTML = items.map(item => `<tr>
      <td><input type="checkbox" data-email="${esc(item.email)}" ${(item.retryable || item.state === 'cleanup_ready') ? '' : 'disabled'} ${selected.has(item.email) ? 'checked' : ''}></td>
      <td>${esc(item.email)}</td><td><span class="badge ${esc(item.state)}">${esc(stateText[item.state] || item.state)}</span></td>
      <td>${esc(item.reason)}</td><td class="files">${fileLines(item.pre_retry_files?.length ? item.pre_retry_files : item.files)}</td>
      <td class="files">${fileLines(item.post_retry_files)}</td><td class="files">${esc(item.replacement_file || '—')}</td>
      <td class="files">${fileLines(item.cleanup_files)}</td><td>${esc(item.local_codex_status || '—')}</td>
    </tr>`).join('') || '<tr><td colspan="9" class="muted">未发现需要处理的 CPA 401 账号。</td></tr>';
    const retryEmails = [...selected].filter(email => items.some(item => item.email === email && item.retryable));
    const cleanupEmails = [...selected].filter(email => items.some(item => item.email === email && item.state === 'cleanup_ready'));
    $('#retryBtn').disabled = retryEmails.length === 0;
    $('#retryBtn').textContent = `补跑 Codex（已选 ${retryEmails.length}）`;
    $('#cleanupBtn').disabled = cleanupEmails.length === 0;
    $('#cleanupBtn').textContent = `生成清理审阅（已选 ${cleanupEmails.length}）`;
    $('#selectAll').checked = actionable.length > 0 && actionable.every(item => selected.has(item.email));
    $('#selectAll').indeterminate = selected.size > 0 && !$('#selectAll').checked;
  }
  function applyData(data) {
    items = data.items || [];
    updateCounts(data);
    render();
  }
  async function loadState() {
    try { applyData(await api('/api/cpa-401/state')); }
    catch (error) { message(error.message, 'error'); }
  }
  async function detect() {
    $('#detectBtn').disabled = true; message('正在刷新并检测 CPA 凭证状态…'); $('#cleanupQueue').classList.add('hidden');
    try {
      const data = await api('/api/cpa-401/detect', {method:'POST', body:'{}'});
      selected.clear(); applyData(data);
      message(items.length ? '检测完成。仅明确的单一 401 文件可补跑；已验证替代文件才会进入清理审阅。' : '检测完成，未发现需处理账号。', 'ok');
    } catch (error) { message(error.message, 'error'); }
    finally { $('#detectBtn').disabled = false; }
  }
  $('#detectBtn').addEventListener('click', detect);
  $('#retryBtn').addEventListener('click', async () => {
    const emails = [...selected].filter(email => items.some(item => item.email === email && item.retryable));
    if (!emails.length || !confirm(`补跑选中的 ${emails.length} 个 Codex OAuth？\n\n系统会持久化补跑前文件名，并在任务完成后自动重新读取 CPA 验证；任何失败都保留旧文件。`)) return;
    $('#retryBtn').disabled = true;
    try {
      const data = await api('/api/cpa-401/retry', {method:'POST', body:JSON.stringify({emails, workers:Number($('#workers').value || 1)})});
      for (const email of emails) {
        const item = items.find(row => row.email === email);
        if (item) { item.pre_retry_files = [...(item.files || [])]; item.state='retrying'; item.reason='已启动 Codex OAuth 补跑，等待 CPA 后置验证'; item.retryable=false; }
        selected.delete(email);
      }
      message(data.message || '补跑已启动', 'ok'); render();
    } catch (error) {
      if (error.status === 409) await loadState();
      message(error.message, 'error'); render();
    }
  });
  $('#cleanupBtn').addEventListener('click', async () => {
    const emails = [...selected].filter(email => items.some(item => item.email === email && item.state === 'cleanup_ready'));
    if (!emails.length) return;
    try {
      let data = await api('/api/cpa-401/cleanup', {method:'POST', body:JSON.stringify({emails, confirm_cleanup:false})});
      const lines = [];
      for (const item of data.items || []) {
        lines.push(`${item.email}\n  已验证替代: ${item.replacement_file || '—'}\n  旧文件: ${(item.cleanup_files || []).join(', ') || '—'}`);
      }
      $('#cleanupQueue').textContent = `${data.manual_action || ''}\n\n${lines.join('\n\n')}`.trim();
      $('#cleanupQueue').classList.remove('hidden');
      message(data.cleanup_supported ? '已生成清理清单；如继续将按精确文件名调用已配置的删除适配器。' : '已生成 review-only 清单；当前不会调用任何远端删除。', 'ok');
      if (data.cleanup_supported && confirm('已验证替代凭证。是否按清单精确删除旧 CPA 文件？此操作需要已配置的删除适配器。')) {
        data = await api('/api/cpa-401/cleanup', {method:'POST', body:JSON.stringify({emails, confirm_cleanup:true})});
        message('清理请求已完成；请检查逐文件结果并重新检测。', data.items?.every(item => item.ok) ? 'ok' : 'error');
        await loadState();
      }
    } catch (error) { message(error.message, 'error'); }
  });
  $('#rows').addEventListener('change', event => { const email=event.target.dataset.email; if (!email) return; event.target.checked ? selected.add(email) : selected.delete(email); render(); });
  $('#selectAll').addEventListener('change', event => { selected.clear(); if (event.target.checked) for (const item of items) if (item.retryable || item.state === 'cleanup_ready') selected.add(item.email); render(); });
  loadState();
})();
</script>
</body>
</html>
